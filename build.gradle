plugins {
    id 'java-library'
    id 'org.jetbrains.kotlin.jvm' version "${kotlin_version}"
    id 'org.jetbrains.kotlin.plugin.serialization' version "${kotlin_version}"
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

kotlin {
    jvmToolchain(21)
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            data()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            // Forward -Dglbrender.* from this Gradle JVM to the game, so an unattended run can ask for the
            // auto-join and screenshot behaviour the interactive test does not use by default.
            System.properties.keySet()
                .findAll { it.toString().startsWith('glbrender.') }
                .each { systemProperty it.toString(), System.properties[it] }
            logLevel = org.slf4j.event.Level.DEBUG
            // Export the mixins actually applied, for debugging the ported mixin set.
            systemProperty 'mixin.debug.export', 'true'
            // A dev run's classpath is Minecraft's own library list, not the project's dependencies,
            // so the Kotlin runtime the mod is written in has to be handed to each run explicitly.
            [
                "org.jetbrains.kotlin:kotlin-stdlib:${kotlin_version}",
                "org.jetbrains.kotlinx:kotlinx-serialization-core-jvm:${serialization_version}",
                "org.jetbrains.kotlinx:kotlinx-serialization-json-jvm:${serialization_version}",
                "org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm:${coroutines_version}",
            ].each { notation ->
                additionalRuntimeClasspathConfiguration.dependencies.add(
                    project.dependencies.create(notation)
                )
            }
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.neoforged.net/releases' }
}

dependencies {
    // The ported model layer uses kotlinx-serialization; joml and fastutil come from Minecraft.
    api "org.jetbrains.kotlinx:kotlinx-serialization-json:${serialization_version}"
    // The ported render layer loads models concurrently and hands work to the render thread.
    api "org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm:${coroutines_version}"

    // No mixin annotation processor on NeoForge 1.21.1: the game runs Mojang-mapped at runtime, so
    // @Inject targets use mojmap names and need no refmap. Mixin API comes transitively from NeoForge.
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('layoutSelfTest', JavaExec) {
    group = 'verification'
    description = 'Checks the ported std140/std430 layout math with no Minecraft and no test framework.'
    mainClass = 'top.fifthlight.blazerod.render.common.layout.test.LayoutSelfTestKt'
    // The layout code touches joml and fastutil only, both of which Minecraft already contributes.
    classpath = sourceSets.main.output + configurations.compileClasspath
}

tasks.register('glSelfTest', JavaExec) {
    group = 'verification'
    description = 'Runs the GL shim against an offscreen GLFW context, without Minecraft.'
    mainClass = 'com.huashanlunjian.glbrender.tools.GlSelfTestKt'
    // The shim speaks Minecraft's VertexFormat and ResourceLocation, so the game jar is part of what
    // this test links against; natives come from the runtime classpath.
    classpath = sourceSets.main.output + configurations.compileClasspath + configurations.runtimeClasspath
}

tasks.register('offscreenRender', JavaExec) {
    group = 'verification'
    description = 'Renders a GLB offscreen through the ported renderer and writes a PNG, without Minecraft.'
    mainClass = 'com.huashanlunjian.glbrender.tools.OffscreenRenderKt'
    classpath = sourceSets.main.output + configurations.compileClasspath + configurations.runtimeClasspath
    def glb = gradle.startParameter.projectProperties['glb'] ?: 'test-models/deepseek-chan.glb'
    args glb
    // Optional clip preview: -Pclip=<glTF clip name> -Ptime=<seconds into the clip>.
    def clip = gradle.startParameter.projectProperties['clip']
    if (clip) {
        // The tool takes [glb, outputPath, clip, time]; keep the default output path in place.
        args 'build/offscreen-render.png', clip, gradle.startParameter.projectProperties['time'] ?: '0.0'
    }
}

tasks.register('glbDump', JavaExec) {
    group = 'verification'
    description = 'Parses a GLB with the ported model layer only, without launching Minecraft.'
    mainClass = 'com.huashanlunjian.glbrender.tools.GlbDumpKt'
    // Minecraft's own libraries (joml, fastutil) are on the compile classpath via ModDevGradle.
    classpath = sourceSets.main.output + configurations.compileClasspath
    // Not named "model": project.property('model') resolves to Gradle's own project member, not -Pmodel.
    def glb = gradle.startParameter.projectProperties['glb'] ?: 'test-models/InterpolationTest.glb'
    args glb
}

jar {
    // Keep the FML-side mod metadata readable in a stable order.
    manifest {
        attributes([
            'Specification-Title'   : mod_id,
            'Implementation-Title'  : mod_name,
            'Implementation-Version': mod_version,
        ])
    }
}
