# Machine-specific: the global JAVA_HOME on this box points at JDK 8, and the Gradle
# wrapper prefers JAVA_HOME over PATH. NeoForge's plugin needs 17+ to even load.
# Set this (or JAVA_HOME) to a JDK 21+ if your default is older.
# org.gradle.java.home=C:/Program Files/BellSoft/LibericaJDK-21
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=512m
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Disabled while the mixin annotation processor + Kotlin joint compilation are being
# stabilised; re-enable once the toolchain is known good.
org.gradle.configuration-cache=false

## Environment
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.228
neo_version_range=[21,)
loader_version_range=[4,)
kotlin_version=2.2.21
# Upstream layout is <pkg>/model/, <pkg>/model/loader/, <pkg>/model/gltf/
port_root=top/fifthlight/blazerod
serialization_version=1.9.0
coroutines_version=1.10.2
# Must match the sponge-mixin NeoForge 21.1.228 ships, see neoforge-<ver>-moddev-config.json
mixin_version=0.15.2+mixin.0.8.7

## Mod
mod_id=glbrender
mod_name=GLB Render
mod_license=LGPL-3.0-or-later
mod_version=0.1.0
mod_group_id=com.huashanlunjian.glbrender
mod_authors=华山抡舰
mod_description=Standalone glTF/GLB model rendering library mod for Minecraft 1.21.1, derived from BlazeRod.
